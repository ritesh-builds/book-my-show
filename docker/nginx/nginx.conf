worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Rate Limiting Zones (BookMyShow anti-bot & flash-sale protection)
    # 10MB zone stores ~160,000 unique IP addresses
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=10r/s;

    # Upstream to Fastify backend on host
    upstream fastify_backend {
        server host.docker.internal:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Reverse Proxy Base Settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check endpoint
        location /health {
            proxy_pass http://fastify_backend/health;
            access_log off;
        }

        # Swagger API Documentation
        location /docs {
            proxy_pass http://fastify_backend/docs;
        }

        # Booking API (Strict Rate Limiting against ticket scalpers)
        location /api/v1/bookings {
            limit_req zone=booking_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://fastify_backend;
        }

        # General API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://fastify_backend;
        }

        # Default fallback route
        location / {
            proxy_pass http://fastify_backend;
        }
    }
}
