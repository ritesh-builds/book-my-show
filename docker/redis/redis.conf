# docker/redis/redis.conf — Redis configuration for BookMyShow

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Snapshotting (RDB)
save 900 1
save 300 10
save 60 10000

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
